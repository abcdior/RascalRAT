services:
  rascalrat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8182:8182"
    environment:
      - TOKEN_SERVER_URL=http://validator:8080
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8182/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  validator:
    build:
      context: ../LurkerX/validator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PAYSTACK_SECRET_KEY=sk_test_f60d395afd14fb86f9a599220be875aacc72c261
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - FRONTEND_DIR=./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s