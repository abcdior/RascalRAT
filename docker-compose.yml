services:
  rascalrat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8182}:8182"
    environment:
      - PORT=${PORT:-8182}
      - TOKEN_SERVER_URL=${TOKEN_SERVER_URL:-http://host.docker.internal:8080}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8182/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s